<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--text:#0E0E0E;--muted:#6b6359;--accent:#0e0e0e;--line:#d3cdc2;--bone:#f2efe8;--stone:#8A8176;--serif:"Cormorant Garamond",Georgia,serif}
html,body{margin:0;padding:0;max-width:100%;font-family:Jost,Helvetica,Arial,sans-serif;color:#0E0E0E;background:var(--bone)}
body{overflow-x:hidden}button,input,select{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
button,a{-webkit-tap-highlight-color:transparent}

[hidden]{display:none!important}

.rw__sticky{height:var(--frame-h,100svh);display:flex;flex-direction:column}

.rw__left{position:relative;display:flex;flex-direction:column;overflow:hidden}
.rw__head{padding:44px 56px 0;z-index:5}
.rw__title{margin:0 0 12px;font-family:var(--serif);font-weight:400;font-size:58px;line-height:1;letter-spacing:-.01em}
.rw__sub{margin:0;font-size:12px;line-height:1.55;color:var(--muted);max-width:46ch}
.rw__sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

.rw__stage.drag{cursor:grabbing}.rw__stage:focus-visible{box-shadow:inset 0 0 0 2px #0e0e0e}
.rw__model{position:absolute;left:0;bottom:0;transform-origin:50% 100%;will-change:transform,opacity;opacity:0}
.rw__figure{position:relative;height:var(--mh,560px);aspect-ratio:9/16}

.rw__figure img.dec{opacity:1}
.rw__shadow{position:absolute;left:58%;bottom:0;width:150%;height:9%;min-height:14px;max-height:46px;transform:translate(-50%,50%);filter:blur(2px);background:radial-gradient(closest-side,rgb(20 16 12/.3),rgb(20 16 12/.14) 45%,rgb(20 16 12/.04) 75%,rgb(20 16 12/0))}
.rw__hit{position:absolute;inset:0;z-index:1;background:none;border:0;border-radius:24px;cursor:pointer}
.rw__sweep{position:absolute;inset:0;z-index:50;pointer-events:none;mix-blend-mode:soft-light;overflow:hidden}
.rw__sweep::before{content:"";position:absolute;top:-20%;bottom:-20%;width:42%;opacity:0;transform:translateX(-130%) skewX(-12deg);background:linear-gradient(100deg,transparent,rgb(255 255 255/.25) 42%,rgb(255 255 255/.55) 50%,rgb(255 255 255/.25) 58%,transparent)}
.is-sweep .rw__sweep::before{animation:sweep 1.5s cubic-bezier(.65,0,.35,1)}
@keyframes sweep{0%{transform:translateX(-130%) skewX(-12deg);opacity:0}18%{opacity:1}100%{transform:translateX(330%) skewX(-12deg);opacity:0}}
.rw__controls{display:flex;align-items:center;gap:20px;padding:6px 44px 30px;z-index:5}
.rw__icon{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;position:relative;cursor:pointer}
.rw__icon::before{content:"";position:absolute;inset:2px;border-radius:50%;border:1px solid currentColor;opacity:0;transform:scale(.55);transition:transform .7s var(--ease),opacity .4s}
.rw__icon:hover::before{opacity:.22;transform:scale(1)}
.rw__icon svg{transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
[data-prev]:hover svg{transform:translateX(-4px)}[data-next]:hover svg{transform:translateX(4px)}.rw__icon:active svg{transform:scale(.88)}
.rw__auto .pa{display:none}.is-playing .rw__auto .pl{display:none}.is-playing .rw__auto .pa{display:block}
.rw__ticks{display:flex;flex:1;gap:6px;min-width:0}
.rw__tick{flex:0 1 44px;min-width:14px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:9px;color:var(--muted);text-align:left;background:none;border:0;padding:0;cursor:pointer;transition:flex-basis .8s cubic-bezier(.2,1.25,.3,1),color .3s}
.rw__tick[aria-current=true]{flex:0 0 190px;color:#0E0E0E}
.rw__tick:hover{color:#0E0E0E}.rw__tick:hover .rw__tick-bar{transform:scaleY(1.5)}
.rw__tick-bar{display:block;height:2px;width:100%;overflow:hidden;position:relative;background:color-mix(in srgb,#0E0E0E 14%,transparent);transition:transform .5s var(--ease)}
.rw__tick-bar::after{content:"";position:absolute;inset:0;background:#0E0E0E;transform:scaleX(0);transform-origin:left}
.rw__tick.past .rw__tick-bar::after{transform:scaleX(1);opacity:.35}
.rw__tick[aria-current=true] .rw__tick-bar::after{transform:scaleX(1);background:var(--accent)}
.is-playing .rw__tick[aria-current=true] .rw__tick-bar::after{transform:scaleX(0)}
.is-playing .rw__tick[aria-current=true].run .rw__tick-bar::after{animation:fill var(--speed,5s) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.rw__tick-label{font-size:10px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rw__tick-name{display:none}.rw__tick[aria-current=true] .rw__tick-name{display:inline;animation:nin 1.1s var(--ease) .1s backwards}
@keyframes nin{from{opacity:0;letter-spacing:.34em}}
.rw__panel{position:relative;border-left:1px solid var(--line);background:var(--bone)}
.rw__panel-inner{position:absolute;inset:0;display:flex;flex-direction:column}
.rw__panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:44px 32px 18px}
.rw__panel-title{margin:0;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1}
.rw__label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rw__look-panel{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.rw__items{list-style:none;margin:0;padding:6px 32px 20px;display:flex;flex-direction:column;overflow-y:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain;scrollbar-width:thin}
.rw__item{position:relative;display:grid;grid-template-columns:92px minmax(0,1fr) 44px;column-gap:18px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.rw__item:last-child{border-bottom:1px solid var(--line)}
.rw__item::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--ease)}
.rw__item:hover::after,.rw__item.is-hot::after{transform:scaleX(1)}
.is-in .rw__item{animation:itemin 1.1s var(--ease) backwards;animation-delay:calc(var(--i)*85ms + 140ms)}
@keyframes itemin{from{opacity:0;transform:translateY(26px);filter:blur(8px)}}
.rw__media{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:color-mix(in srgb,#0E0E0E 5%,#fff)}
.rw__media img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.rw__item:hover .rw__media img{transform:scale(1.07)}
.rw__num{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:rgb(255 255 255/.9);display:grid;place-items:center;font-size:10px;font-weight:600;transition:background .3s,color .3s,transform .45s cubic-bezier(.2,1.6,.4,1)}
.is-hot .rw__num,.rw__item:hover .rw__num{background:var(--accent);color:#fff;transform:scale(1.12)}
.rw__info{display:flex;flex-direction:column;gap:5px;min-width:0}
.rw__type{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw__name{font-size:13px;font-weight:500;line-height:1.3;align-self:flex-start;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .7s var(--ease)}
.rw__name:hover{background-size:100% 1px}.rw__price{font-size:12px}
.rw__tag{position:absolute;top:11px;left:8px;z-index:2;display:flex;flex-direction:column;transform-origin:10px 0;pointer-events:none}
.rw__tag::before{content:"";order:-1;width:1px;height:11px;margin-left:10px;background:color-mix(in srgb,#0E0E0E 50%,transparent)}
.rw__tag span{background:#0E0E0E;color:#fff;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border-radius:2px}
.rw__item:hover .rw__tag{animation:swing 1.4s cubic-bezier(.3,.7,.4,1)}
@keyframes swing{0%{transform:rotate(-16deg)}25%{transform:rotate(11deg)}45%{transform:rotate(-7deg)}65%{transform:rotate(4deg)}82%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.rw__add{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;align-self:end;cursor:pointer;position:relative}
.rw__add svg{grid-area:1/1;transition:transform .55s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.rw__add .ck,.rw__add .sp{opacity:0}
.rw__item.is-picking .pl{transform:rotate(45deg)}
.rw__item.is-loading .pl{opacity:0}.rw__item.is-loading .sp{opacity:1;animation:spin .8s linear infinite}
.rw__item.is-added .pl{opacity:0}.rw__item.is-added .ck{opacity:1;color:var(--accent);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.rw__picker{grid-column:1/-1;display:flex;flex-direction:column;gap:14px;padding-top:16px;animation:drop .7s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.rw__opt{border:0;padding:0;margin:0}.rw__opt legend{font-size:11px;margin-bottom:8px;padding:0}
.rw__vals{display:flex;flex-wrap:wrap;gap:8px}
.rw__pill{position:relative}.rw__pill input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}

.rw__pill:hover span{border-color:#0E0E0E}.rw__pill input:checked+span{background:#0E0E0E;color:#fff;border-color:#0E0E0E}
.rw__pill:active span{transform:scale(.94)}.rw__pill input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.rw__confirm,.rw__cta{position:relative;overflow:hidden;border:0;border-radius:0;background:#0E0E0E;color:#fff;font-weight:500;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rw__confirm{min-height:46px;font-size:11px;letter-spacing:.02em;transition:transform .4s cubic-bezier(.2,1.5,.4,1)}
.rw__confirm:hover{transform:translateY(-1px)}
.rw__confirm::before,.rw__cta::before{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(100deg,transparent,rgb(255 255 255/.26) 50%,transparent);transform:translateX(-140%) skewX(-18deg)}
.rw__confirm:hover::before,.rw__cta:hover::before{transform:translateX(260%) skewX(-18deg);transition:transform 1.1s var(--ease)}
.rw__bundle{padding:20px 32px 30px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line)}
.rw__msg{margin:0;font-size:11px;line-height:1.45;color:var(--accent)}.rw__msg:empty{display:none}
.rw__bundle-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.rw__bundle-copy{display:flex;flex-direction:column;gap:3px}.rw__bundle-title{font-size:13px;font-weight:500}.rw__bundle-note{font-size:11px;color:var(--muted)}
.rw__bundle-price{display:flex;align-items:baseline;gap:10px;white-space:nowrap}.rw__bundle-price s{font-size:11px;color:var(--muted)}.rw__bundle-price strong{font-weight:400;font-size:16px}
.is-in .rw__bundle-row{animation:rise 1s var(--ease) .38s backwards}.is-in .rw__cta{animation:rise 1s var(--ease) .46s backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.rw__cta{min-height:56px;width:100%;font-size:13px;letter-spacing:.02em;gap:12px;transition:transform .6s var(--ease),background .45s,box-shadow .6s var(--ease)}
.rw__cta:hover{transform:translateY(-2px);box-shadow:0 18px 34px -22px color-mix(in srgb,#0E0E0E 80%,transparent)}
.rw__cta:hover svg{transform:translateX(4px)}.rw__cta svg{transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.rw__cta:active{transform:scale(.985)}.rw__cta:disabled{opacity:.5}
.rw__cta-m,.rw__cta-done{display:none}.is-complete .rw__cta{background:var(--accent);animation:glow 1.8s var(--ease)}
.is-complete .rw__cta-add{display:none}.is-complete .rw__cta-done{display:inline}
@keyframes glow{from{box-shadow:0 0 0 0 color-mix(in srgb,#0e0e0e 55%,transparent)}to{box-shadow:0 0 0 16px transparent}}
.rw__lb{position:absolute;inset:0;z-index:40;visibility:hidden;pointer-events:none;transition:visibility 0s .5s}
.rw--zoom .rw__lb{visibility:visible;pointer-events:auto;transition:none}
.rw__lb::before{content:"";position:absolute;inset:0;background:var(--bone);opacity:0;transition:opacity .45s}.rw--zoom .rw__lb::before{opacity:1}

.rw__lb-model{position:relative;cursor:default;animation:grow .95s var(--ease)}
@keyframes grow{from{transform:scale(.9);opacity:0}}
.rw__lb-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:16px;padding:32px 32px 0 56px}

.rw__lb-hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;margin:0;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);pointer-events:none}

@keyframes pinin{from{transform:scale(0);opacity:0}}
.rw__pin-dot{position:relative;width:24px;height:24px;border-radius:50%;background:rgb(255 255 255/.86);backdrop-filter:blur(6px);font-size:11px;font-weight:600;line-height:1;display:grid;place-items:center;box-shadow:0 4px 14px -4px rgb(0 0 0/.35);transition:transform .5s cubic-bezier(.2,1.6,.4,1),background .25s,color .25s}

.rw__pin:hover .rw__pin-dot,.rw__pin.is-hot .rw__pin-dot{transform:scale(1.3);background:var(--accent);color:#fff}
.rw__pin::after{content:attr(data-tip);position:absolute;left:calc(100% - 6px);top:50%;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 12px;border-radius:999px;background:rgb(255 255 255/.88);backdrop-filter:blur(10px);font-size:11px;font-weight:500;letter-spacing:.04em;line-height:1;box-shadow:0 10px 26px -12px rgb(0 0 0/.4);opacity:0;transform:translate(-8px,-50%) scale(.96);transform-origin:left;transition:opacity .35s,transform .6s var(--ease);pointer-events:none}
.rw__pin:hover::after,.rw__pin.is-hot::after,.rw__pin:focus-visible::after{opacity:1;transform:translate(0,-50%)}
.rw--zoom .rw__stage,.rw--zoom .rw__head{opacity:0;pointer-events:none;transition:opacity .35s}
.rw__head,.rw__stage{transition:opacity .7s var(--ease) .2s}
.rw--js:not(.is-revealed) .rw__head>*,.rw--js:not(.is-revealed) .rw__panel-head{opacity:0;transform:translateY(22px);filter:blur(8px)}

.rw__stage,.rw__controls,.rw__panel{transition:opacity 1.4s .2s}

 if(sh){sh.textContent=ship?'Shipping '+money(ship):'Shipping included';tt2.textContent='Total '+money(sub+ship)}}
const payDlg=document.getElementById('pay-dialog'),payBody=document.getElementById('pay-body');
payDlg.addEventListener('click',e=>{const r=payDlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom||e.target.closest('[data-close]'))payDlg.close()});
function showPay(o){const m=(CFG.methods||[]).find(x=>x.key===o.payment_method)||{},vf=m.key==='vodafone_cash';
 payBody.innerHTML=`<div class="bag-heading"><h2>Complete your payment</h2><button data-close aria-label="Close">×</button></div>
 <p class="bag-note">Order <strong>${esc(o.reference)}</strong>. We hold your items for ${CFG.manual_hold_minutes||180} minutes.</p>
 <div class="pay-box"><div><span class="rw__label">Send exactly</span><strong>${money(o.total,o.currency)}</strong></div>
 <div><span class="rw__label">${vf?'Vodafone Cash number':'InstaPay address'}</span><strong>${esc(m.account||'')}</strong>${m.holder?`<small>${esc(m.holder)}</small>`:''}</div></div>
 <ol class="pay-steps"><li>Open ${vf?'your Vodafone Cash wallet':'the InstaPay app'} and send the amount above.</li><li>If the app has a note field, write <b>${esc(o.reference)}</b>.</li><li>Enter the transfer reference below. We confirm it and start preparing your order.</li></ol>
 <form id="proof-form" novalidate><label class="fld">${vf?'Number you sent from':'Your InstaPay address or phone'}<input name="sender" required maxlength="60"></label>
 <label class="fld">Transfer reference / transaction ID<input name="txn" required maxlength="40"></label>
 <div class="form-error" id="proof-err" role="alert"></div><button class="btn" type="submit">I have sent the money</button></form>`;
 document.getElementById('proof-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.btn'),er=document.getElementById('proof-err');er.textContent='';b.disabled=true;
  try{await post('/api/orders/proof',Object.assign(Object.fromEntries(new FormData(e.target)),{reference:o.reference}));payDlg.close();toast('Thanks. We are checking your transfer and will confirm your order.')}
  catch(x){er.textContent=x.message;b.disabled=false}};
 if(!payDlg.open)payDlg.showModal()}
(()=>{const q=new URLSearchParams(location.search);if(q.has('signin')){history.replaceState(null,'',location.pathname);if(!ME)openAuth('login')}if(q.has('signed_in')){history.replaceState(null,'',location.pathname);toast('Signed in with Google')}
 if(q.has('auth_error')){history.replaceState(null,'',location.pathname);toast('Google sign-in did not work. Please try again.')}})();
// back from the payment page: ask the server what happened (never trust the URL)
(async()=>{const ref=new URLSearchParams(location.search).get('order');if(!ref)return;history.replaceState(null,'',location.pathname);
 if(!ME){toast('Sign in to see your order');return}
 try{const L=await (await fetch('/api/orders/mine')).json(),o=L.find(z=>z.reference===ref);if(!o)return;
  if(o.payment_status==='paid'){bag.save([]);bag.render();toast('Payment received — order '+o.reference+' is confirmed')}
  else if(o.payment_status==='failed'||o.status==='cancelled')toast('The payment did not go through. Your bag is still here, try again.');
  else toast('We are confirming your payment. Check “Your orders” in a minute.')}catch(e){}})();

document.getElementById('sub-form').addEventListener('submit',async e=>{e.preventDefault();try{await post('/api/subscribe',{email:document.getElementById('sub-email').value});e.target.reset();toast('Thanks — you are on the list')}catch(err){toast(err.message)}});
if(ME)document.getElementById('account-label').textContent=ME.name.trim().split(' ')[0];loadAddr();
customElements.define('runway-section',RunwaySection);
})();
